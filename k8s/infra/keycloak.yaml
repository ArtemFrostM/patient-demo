# Generated by AI
apiVersion: v1
kind: Service
metadata:
  name: keycloak # → http://keycloak:8080 for services
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8 # version of compose
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: patient-demo-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: REF_DATA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: patient-demo-secrets
                  key: REF_DATA_CLIENT_SECRET
            - name: REF_DATA_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: patient-demo-secrets
                  key: REF_DATA_ADMIN_CLIENT_SECRET
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import   # звідси читає --import-realm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 36                     # до 3 хв на старт
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm                     # ← з 6.2