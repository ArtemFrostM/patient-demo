spring.application.name=patient-demo
server.port=${SERVER_PORT:8380}

# --- DataSource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patient_demo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Errors: expose ResponseStatusException reason (e.g. which allergy ids are unknown) ---
spring.web.error.include-message=always

# --- ref-data-service client ---
ref-data.base-url=${REF_DATA_BASE_URL:http://localhost:8381}
ref-data.connect-timeout=2s
ref-data.read-timeout=5s

# --- OAuth2 client credentials (Keycloak) for calls to ref-data-service ---
spring.security.oauth2.client.registration.ref-data.provider=keycloak
spring.security.oauth2.client.registration.ref-data.client-id=patient-service
spring.security.oauth2.client.registration.ref-data.client-secret=${REF_DATA_CLIENT_SECRET:}
spring.security.oauth2.client.registration.ref-data.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.ref-data.scope=allergy:read
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/patient-demo/protocol/openid-connect/token}
